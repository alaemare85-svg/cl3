<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="ابحث في الويب وتصفح روابط مواقع التواصل الاجتماعي."
    >
    <title>wcl3</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <h1 class="site-name">wcl3</h1>
      <p class="intro">ابحث في الويب واكتشف ما تريد.</p>

      <form id="search-form" class="search-form" action="https://www.google.com/search" method="get" role="search">
        <label class="visually-hidden" for="search-input">ما الذي تريد البحث عنه؟</label>
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="اكتب كلمات البحث هنا"
          autocomplete="off"
          required
        >
        <button type="submit">بحث</button>
      </form>
      <p id="search-message" class="message" aria-live="polite"></p>

      <section class="social-section" aria-labelledby="social-heading">
        <h2 id="social-heading">مواقع التواصل الاجتماعي</h2>
        <nav class="social-links" aria-label="روابط منصات التواصل الاجتماعي">
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube</a>
          <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">TikTok</a>
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">Facebook</a>
          <a href="https://x.com/" target="_blank" rel="noopener noreferrer">X</a>
        </nav>
      </section>
    </main>
  </body>
</html>
