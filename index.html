<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="ابحث في الويب وتصفح روابط مواقع التواصل الاجتماعي."
    >
    <title>wcl3</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" type="module"></script>
  </head>
  <body>
    <canvas id="canvas" aria-hidden="true"></canvas>
    <main class="card">
      <h1 class="site-name">wcl3</h1>
      <p class="intro">ابحث في الويب واكتشف ما تريد.</p>

      <form id="search-form" class="search-form" action="https://www.google.com/search" method="get" role="search">
        <label class="visually-hidden" for="search-input">ما الذي تريد البحث عنه؟</label>
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="اكتب كلمات البحث هنا"
          autocomplete="off"
          required
        >
        <button type="submit">بحث</button>
      </form>
      <p id="search-message" class="message" aria-live="polite"></p>

      <section class="auth-section" aria-labelledby="auth-heading">
        <h2 id="auth-heading">حساب العميل</h2>
        <form id="auth-form" class="auth-form">
          <label for="customer-email">البريد الإلكتروني</label>
          <input
            id="customer-email"
            type="email"
            name="email"
            autocomplete="email"
            required
          >
          <label for="customer-password">كلمة المرور</label>
          <input
            id="customer-password"
            type="password"
            name="password"
            minlength="6"
            autocomplete="new-password"
            required
          >
          <div class="auth-actions">
            <button id="auth-submit" class="auth-submit" type="submit" disabled>
              إنشاء حساب
            </button>
            <button id="auth-toggle" class="auth-toggle" type="button">
              لديك حساب؟ سجّل الدخول
            </button>
          </div>
        </form>
        <div id="auth-session" class="auth-session" hidden>
          <p id="auth-welcome"></p>
          <button id="auth-signout" type="button">تسجيل الخروج</button>
        </div>
        <p id="auth-message" class="auth-message" data-state="info" role="status" aria-live="polite">
          يلزم إعداد مشروع Supabase لتفعيل الحسابات.
        </p>
      </section>

      <section class="social-section" aria-labelledby="social-heading">
        <h2 id="social-heading">مواقع التواصل الاجتماعي</h2>
        <nav class="social-links" aria-label="روابط منصات التواصل الاجتماعي">
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
            <img src="https://cdn.simpleicons.org/instagram/E4405F" alt="" width="24" height="24" loading="lazy">
          </a>
          <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
            <img src="https://cdn.simpleicons.org/youtube/FF0000" alt="" width="24" height="24" loading="lazy">
          </a>
          <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok">
            <img src="https://cdn.simpleicons.org/tiktok/000000" alt="" width="24" height="24" loading="lazy">
          </a>
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook">
            <img src="https://cdn.simpleicons.org/facebook/0866FF" alt="" width="24" height="24" loading="lazy">
          </a>
          <a href="https://x.com/" target="_blank" rel="noopener noreferrer" aria-label="X" title="X">
            <img src="https://cdn.simpleicons.org/x/000000" alt="" width="24" height="24" loading="lazy">
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
